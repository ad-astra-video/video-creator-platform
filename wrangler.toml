name = "video-creator-platform"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat", "cache_option_enabled"]
workers_dev = true

# D1 database (create via: wrangler d1 create video-creator-platform, then paste the database_id)
[[d1_databases]]
binding = "DB"
database_name = "video-creator-platform"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

# Plain-text vars (non-secret). Secrets (API keys) go in `wrangler secret put`.
[vars]
ALLOWED_ORIGIN = "*"
# Seed demo runners in /api/providers when the orchestrator is unreachable (local/dev).
DEMO_RUNNERS = "1"

# ---------------------------------------------------------------------------
# Environment variable reference (set these as secrets with `wrangler secret put <NAME>`):
#   STRIPE_SECRET_KEY        sk_test_... / sk_live_...
#   STRIPE_WEBHOOK_SECRET    whsec_...  (from Stripe dashboard -> Webhooks)
#   STRIPE_TIERS             JSON tiers: [{"creditsCents":1000,"feeCents":100}, ...]
#   PYMTHOUSE_BASE_URL       e.g. https://<app>.pymthouse.example  (no trailing slash)
#   PYMTHOUSE_ISSUER_URL      OIDC issuer, e.g. https://<app>.pymthouse.example/api/v1/oidc
#   PYMTHOUSE_PUBLIC_CLIENT_ID   app_...
#   PYMTHOUSE_M2M_CLIENT_ID      m2m_...
#   PYMTHOUSE_M2M_CLIENT_SECRET  pmth_cs_...
#   REMOTE_SIGNER_URL         direct signer DMZ base URL (from PymtHouse /signer/routing)
#   PLATFORM_API_KEY         shared key the desktop sends as `Authorization: Bearer <key>`
#   ADMIN_API_KEY            operator key for /admin/* (monitoring + manual credit); never ship to desktop
#   RESEND_API_KEY           email delivery (or Mailgun/SES)
#   EMAIL_FROM               sender address, e.g. credits@yourdomain.com
#   WEBHOOK_SECRET           shared secret with go-livepeer DMZ (-remoteSignerWebhookSecret) for POST /authorize
#   JWT_AUDIENCE             expected `aud` on end-user signer JWTs (optional)
#
# ---- Video Creator API + dispatch layer (Phase 2) ----
#   ORCHESTRATOR_BASE_URL    Livepeer orchestrator base URL (e.g. https://orch.example.com).
#                            Used for runner discovery + job submission. Omit for local/dev.
#   JOB_COST_USD_MICROS      cost (USD micros) debited per dispatched job (default 100000 = $0.10)
#   HF_CLIENT_ID             Hugging Face OAuth client id (https://huggingface.co/settings/applications)
#   HF_CLIENT_SECRET         Hugging Face OAuth client secret
#   HF_REDIRECT_URI          e.g. https://<worker>/api/auth/huggingface/callback
#
# WebSocket: the Worker handles the `/ws` upgrade itself (see src/ws.ts); with
# `main = "src/index.ts"` routing there is no separate route entry needed.
# ---------------------------------------------------------------------------
